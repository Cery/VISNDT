services:
  postgres:
    image: postgres:16-alpine
    container_name: visndt-postgres
    environment:
      POSTGRES_USER: visndt
      POSTGRES_PASSWORD: visndt_dev
      POSTGRES_DB: visndt
    ports:
      - "5432:5432"
    volumes:
      - visndt_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visndt"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3 Compatible Object Storage (MinIO for development)
  # Replace with any S3-compatible service in production
  minio:
    image: minio/minio:latest
    container_name: visndt-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - visndt_minio_data:/data

volumes:
  visndt_postgres_data:
    external: true
  visndt_minio_data:
    external: true