services:
  # ===========================================
  # PostgreSQL Database
  # ===========================================
  postgres:
    image: postgres:16-alpine
    container_name: visndt-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-visndt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visndt_dev}
      POSTGRES_DB: ${POSTGRES_DB:-visndt}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-visndt}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - visndt-network

  # ===========================================
  # Backend API
  # ===========================================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: visndt-api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${API_PORT:-4000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-visndt}:${POSTGRES_PASSWORD:-visndt_dev}@postgres:5432/${POSTGRES_DB:-visndt}
      JWT_SECRET: ${JWT_SECRET:-visndt-smoke-test-jwt-secret-2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-86400}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:3001}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - visndt-network

  # ===========================================
  # Admin Frontend
  # ===========================================
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: visndt-admin
    ports:
      - "${ADMIN_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - visndt-network

volumes:
  postgres_data:

networks:
  visndt-network:
    driver: bridge